<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ange Mwamba's Adventurous Meerkat | ITIS3135 | Introduction Form</title>
    <link rel="icon" type="image/png" sizes="128x128" href="images/flow_favicon_128.png">
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous" defer></script>
</head>
<body>
    <!-- This div is the insertion point for the shared header loaded by HTMLInclude.js. -->
    <div data-include="components/header.html"></div>
    <main>
        <h2>Introduction Form</h2>
<h3>Please Submit the Form Below.</h3>
<!-- The introduction-form id lets JavaScript read, submit, reset, and hide this form.
     The survey-form class reuses the course site's accessible form styling.
     Each input id connects its label's for attribute to the field; the upload id also
     lets JavaScript read a replacement picture. Names identify the submitted data. -->
<form id="introduction-form" class="survey-form">
<fieldset><legend>Your introduction</legend>
<label for="firstName">First name<input id="firstName" name="firstName" value="Angie" placeholder="First name" required></label>
<label for="middleName">Middle name (optional)<input id="middleName" name="middleName" value="" placeholder="Middle name (optional)"></label>
<label for="nickname">Nickname (optional)<input id="nickname" name="nickname" value="" placeholder="Nickname (optional)"></label>
<label for="lastName">Last name<input id="lastName" name="lastName" value="Mwamba" placeholder="Last name" required></label>
<label for="acknowledgment">Acknowledgment<input id="acknowledgment" name="acknowledgment" value="I understand that this is a public webpage and that anything I put here can be seen by anyone" placeholder="Acknowledgment" required></label>
<label for="signature">Acknowledgment initials<input id="signature" name="signature" value="ATM" placeholder="Acknowledgment initials" required></label>
<label for="date">Acknowledgment date<input id="date" name="date" value="9/17/26" placeholder="Acknowledgment date" required></label>
<label for="adjective">Mascot adjective<input id="adjective" name="adjective" value="Adventurous" placeholder="Mascot adjective" required></label>
<label for="animal">Mascot animal<input id="animal" name="animal" value="Meerkat" placeholder="Mascot animal" required></label>
<label for="divider">Divider<input id="divider" name="divider" value="~" placeholder="Divider" required></label>
<label for="picture">Default picture URL<input id="picture" name="picture" value="images/p2.jpeg" placeholder="Default picture URL" required></label>
<label for="pictureAlt">Picture description<input id="pictureAlt" name="pictureAlt" value="Professional portrait of Ange Mwamba" placeholder="Picture description" required></label>
<label for="caption">Picture caption<input id="caption" name="caption" value="Mood after Church" placeholder="Picture caption" required></label>
<label for="statement">Personal statement<input id="statement" name="statement" value="I&#x27;m a senior at UNC Charlotte in the College of Computing and Informatics, pursuing a B.A. in Computer Science with a Human-Computer Interaction concentration, plus a Project Management Certificate. I also run Lux Events &amp; Photography LLC, an event rental and photography business. Between school and running my own business, I&#x27;ve learned to move quickly between technical problem-solving and client-facing work." placeholder="Personal statement" required></label>
<label for="bullet0">Personal Background<input id="bullet0" name="bullet0" value="I was born and raised in the Democratic Republic of Congo." placeholder="Personal Background" required></label>
<label for="bullet1">Professional Background<input id="bullet1" name="bullet1" value="Events business owner and a flex worker." placeholder="Professional Background" required></label>
<label for="bullet2">Academic Background<input id="bullet2" name="bullet2" value="I am a transfer student from CPCC since August 2025 and a current senior." placeholder="Academic Background" required></label>
<label for="bullet3">Primary Work Computer<input id="bullet3" name="bullet3" value="MacBook Pro M3, macOS Tahoe 26.6.2." placeholder="Primary Work Computer" required></label>
<label for="bullet4">Primary Work Location<input id="bullet4" name="bullet4" value="My desk at my home office, where I normally do my homework." placeholder="Primary Work Location" required></label>
<label for="bullet5">Alternate Computer &amp;amp; Location<input id="bullet5" name="bullet5" value="The computer from my school library, or my husband&#x27;s computer." placeholder="Alternate Computer &amp;amp; Location" required></label>
<label for="quote">Quote<input id="quote" name="quote" value="I can do all things through Christ who strengthens me" placeholder="Quote" required></label>
<label for="author">Quote author<input id="author" name="author" value="Philippians 4:13" placeholder="Quote author" required></label>
<label for="funny">Funny thing (optional)<input id="funny" name="funny" value="" placeholder="Funny thing (optional)"></label>
<label for="share">Something to share (optional)<input id="share" name="share" value="" placeholder="Something to share (optional)"></label>
<label for="upload">Upload a replacement picture (optional)<input id="upload" type="file" accept="image/*"></label></fieldset>
<fieldset><legend>Courses I’m Taking, &amp; Why (seventh main bullet)</legend><!-- The courses div groups dynamic course rows so JavaScript can add and reset them.
     Its id selects that container. Each course class identifies a removable fieldset;
     each delete-course class identifies its delete button for delegated click handling.
     The add-course id selects the button that appends a new course fieldset. -->
<div id="courses"><fieldset class="course"><legend>Course</legend><label>Department<input data-course="department" value="ITIS" placeholder="Department" required></label><label>Number<input data-course="number" value="3135" placeholder="Number" required></label><label>Course name<input data-course="name" value="Front-End Web App Development" placeholder="Course name" required></label><label>Reason<input data-course="reason" value="I want to build a strong technical foundation to complement my HCI concentration." placeholder="Reason" required></label><button type="button" class="delete-course">Delete course</button></fieldset><fieldset class="course"><legend>Course</legend><label>Department<input data-course="department" value="ITIS" placeholder="Department" required></label><label>Number<input data-course="number" value="3140" placeholder="Number" required></label><label>Course name<input data-course="name" value="User Experiences" placeholder="Course name" required></label><label>Reason<input data-course="reason" value="Directly supports my concentration and gives me hands-on methods for research and design." placeholder="Reason" required></label><button type="button" class="delete-course">Delete course</button></fieldset><fieldset class="course"><legend>Course</legend><label>Department<input data-course="department" value="PROS" placeholder="Department" required></label><label>Number<input data-course="number" value="2101" placeholder="Number" required></label><label>Course name<input data-course="name" value="Project Management" placeholder="Course name" required></label><label>Reason<input data-course="reason" value="Pairs with the Project Management certification I&#x27;m completing and gives me formal grounding for the client work I already do at Lux Events." placeholder="Reason" required></label><button type="button" class="delete-course">Delete course</button></fieldset><fieldset class="course"><legend>Course</legend><label>Department<input data-course="department" value="STAT" placeholder="Department" required></label><label>Number<input data-course="number" value="1220" placeholder="Number" required></label><label>Course name<input data-course="name" value="Elements of Statistics I" placeholder="Course name" required></label><label>Reason<input data-course="reason" value="Useful for data-driven decision-making, both in coursework and in running my business." placeholder="Reason" required></label><button type="button" class="delete-course">Delete course</button></fieldset><fieldset class="course"><legend>Course</legend><label>Department<input data-course="department" value="ITIS" placeholder="Department" required></label><label>Number<input data-course="number" value="4214" placeholder="Number" required></label><label>Course name<input data-course="name" value="Usable Security and Privacy" placeholder="Course name" required></label><label>Reason<input data-course="reason" value="Course requirement, and relevant since I handle client data." placeholder="Reason" required></label><button type="button" class="delete-course">Delete course</button></fieldset></div><button type="button" id="add-course">Add course</button></fieldset><fieldset><legend>Footer links</legend><label for="linkLabel0">Link 1 label<input id="linkLabel0" name="linkLabel0" value="GitHub" placeholder="Link 1 label" required></label>
<label for="linkUrl0">Link 1 URL<input id="linkUrl0" name="linkUrl0" value="https://github.com/amwamba-cell" placeholder="Link 1 URL" required></label>
<label for="linkLabel1">Link 2 label<input id="linkLabel1" name="linkLabel1" value="GitHub.io" placeholder="Link 2 label" required></label>
<label for="linkUrl1">Link 2 URL<input id="linkUrl1" name="linkUrl1" value="https://amwamba-cell.github.io/" placeholder="Link 2 URL" required></label>
<label for="linkLabel2">Link 3 label<input id="linkLabel2" name="linkLabel2" value="freeCodeCamp" placeholder="Link 3 label" required></label>
<label for="linkUrl2">Link 3 URL<input id="linkUrl2" name="linkUrl2" value="https://www.freecodecamp.org/angie_mwamba" placeholder="Link 3 URL" required></label>
<label for="linkLabel3">Link 4 label<input id="linkLabel3" name="linkLabel3" value="Codecademy" placeholder="Link 4 label" required></label>
<label for="linkUrl3">Link 4 URL<input id="linkUrl3" name="linkUrl3" value="https://www.codecademy.com/profiles/angie_mwamba" placeholder="Link 4 URL" required></label>
<label for="linkLabel4">Link 5 label<input id="linkLabel4" name="linkLabel4" value="LinkedIn" placeholder="Link 5 label" required></label>
<label for="linkUrl4">Link 5 URL<input id="linkUrl4" name="linkUrl4" value="https://www.linkedin.com/in/angie-mwamba-a12818387/" placeholder="Link 5 URL" required></label>
</fieldset>
<!-- The clear id connects the Clear button to its JavaScript handler.
     The following div places the three code-generation actions on their own line.
     The introduction-result div and id provide a hidden destination for the rendered
     introduction so the form values remain available when the visitor starts again.
     The generated-output id selects the source-output section for appending and clearing
     textareas. Its h3 identifies the section, which stays hidden until code is generated.
     Generated output-* ids connect those textareas to their labels.
     JavaScript adds the start-again id to the reset link to attach its event handler,
     and the display-name class to the name heading to match the introduction's alignment. -->
<button type="submit">Submit</button><button type="reset">Reset</button><button type="button" id="clear">Clear</button><div><button type="button" data-format="html">Generate HTML</button><button type="button" data-format="json">Generate JSON</button><button type="button" data-format="xml">Generate XML</button></div></form><div id="introduction-result" hidden></div><section id="generated-output" aria-live="polite" hidden>
    <h3>Generated Code</h3>
</section>
    </main>
    <!-- This div is the insertion point for the shared footer loaded by HTMLInclude.js. -->
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.js"></script>
    <script src="scripts/introduction.js"></script>
</body>
</html>
